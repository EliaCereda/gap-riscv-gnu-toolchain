[workspace]
name = "gap-riscv-gnu-toolchain"
description = "Recipe repo for the GAP RISC-V GNU toolchain conda package"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
rattler-build = ">=0.40"

[tasks]
build = "rattler-build build --recipe recipe/recipe.yaml --output-dir output"
test = "rattler-build test --package-file"
