# Build with conda-forge's compilers and standard library so the package is
# built the same way as the rest of the conda ecosystem. On Linux gcc 13 is
# closest to the distro compilers this toolchain was proven to build with, and
# the sysroot sets the __glibc >=2.28 floor (== Pixi's default solve baseline,
# so consumers need no [system-requirements] override). On macOS the same
# stdlib() mechanism selects the deployment target instead; clang takes
# conda-forge's default version.
# clang is pinned to 18 on macOS: the toolchain is proven to build with
# clang 18 (manual osx-arm64 build), while clang >= 19 rejects gdb's
# enum-flags template (stricter constant evaluation of out-of-range enum
# casts).
c_compiler_version:
  - if: linux
    then: "13"
  - if: osx
    then: "18"
cxx_compiler_version:
  - if: linux
    then: "13"
  - if: osx
    then: "18"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
