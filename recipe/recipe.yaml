schema_version: 1

context:
  # Upstream "release-v24.02"; the tag only exists in the private idsia-robotics
  # fork but points at this public master commit. Conda parses 24.02 == 24.2;
  # the trailing .0 leaves room for respins (24.02.1) and patched variants.
  version: "24.02.0"
  rev: fbb9fa450d01c1c170f94af817490f41c5ef7971

package:
  name: gap-riscv-gnu-toolchain
  version: ${{ version }}

source:
  git: https://github.com/GreenWaves-Technologies/gap-riscv-gnu-toolchain.git
  rev: ${{ rev }}
  patches:
    - ../patches/toolchain/0001-disable-gdb-python.patch

build:
  number: 2
  prefix_detection:
    # Do NOT rewrite the build prefix inside the ELF binaries: GCC 7's driver
    # constant-folds strlen() of the compiled-in prefix at -O2, so shortening
    # the embedded string at install time corrupts its specs-file lookup
    # ("<prefix>/lib/gcc/: Is a directory"). Left untouched, the baked-in
    # build path simply doesn't exist at runtime and GCC falls back to its
    # fully supported argv[0]-relative self-relocation.
    ignore_binary_files: true

requirements:
  build:
    # conda-forge compilers + sysroot: the glibc floor comes from the pinned
    # sysroot (see variants.yaml) via its strong run export (__glibc >=2.28),
    # independent of the build host.
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
    - gawk
    - sed
    - bison
    - flex
    - texinfo
    - gperf
    - diffutils
    - bc
    # download_prerequisites prefers wget; bzip2 extracts its .tar.bz2 files
    - wget
    - bzip2
    - autoconf
    - automake
    - libtool
    - file
    # modern config.sub/config.guess for the 2017-era source trees (arm64-apple)
    - gnuconfig
    # Deliberately NOT ncurses/expat/xz/zlib: gdb links its termcap stub when
    # none is found, and any conda .so dependency would become a NEEDED entry
    # that cannot be resolved at runtime (binary prefix relocation is off, so
    # baked rpaths are dead). Host binaries must depend on glibc only.
  # The host binaries link libstdc++/libgcc statically (see build.sh), so the
  # compilers' run exports are not real runtime requirements — only the
  # sysroot's __glibc export is.
  ignore_run_exports:
    by_name:
      - libstdcxx
      - libgcc

tests:
  - script:
      - riscv32-unknown-elf-gcc --version
      - riscv32-unknown-elf-gcc -print-multi-lib
      # Full compile+link of the rv32imcxgap9 multilib. __global_pointer$ is
      # normally provided by the GAP SDK's chip-specific linker scripts; a
      # standalone link needs it supplied by hand.
      - riscv32-unknown-elf-gcc -march=rv32imcxgap9 -mcmodel=medlow tests/hello.c -o hello '-Wl,--defsym,__global_pointer$=0x1000'
      - riscv32-unknown-elf-objdump -d hello | head -n 40
    files:
      recipe:
        - tests/hello.c

about:
  summary: GAP RISC-V GNU toolchain (riscv32-unknown-elf GCC, binutils, newlib) for GreenWaves GAP processors
  license: GPL-3.0-or-later WITH GCC-exception-3.1
  license_file:
    - riscv-gcc/COPYING3
    - riscv-binutils-gdb/COPYING
    - riscv-newlib/COPYING.NEWLIB
  homepage: https://greenwaves-technologies.com/
  repository: https://github.com/GreenWaves-Technologies/gap-riscv-gnu-toolchain
