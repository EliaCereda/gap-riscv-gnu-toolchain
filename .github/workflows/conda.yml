name: conda

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-musl }
          - { os: macos-15, platform: osx-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: osx-64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: write # to post the build log as a commit comment on failure
    steps:
      - uses: actions/checkout@v4
      - name: Install rattler-build
        run: |
          sudo curl -fsSL "https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-${{ matrix.target }}" \
            -o /usr/local/bin/rattler-build
          sudo chmod +x /usr/local/bin/rattler-build
          rattler-build --version
      - name: Build package
        run: |
          set -o pipefail
          rattler-build build --recipe recipe/recipe.yaml --output-dir output 2>&1 | tee build.log
      - name: Check host binaries only link system libraries
        # Binary prefix relocation is disabled, so any reference into the build
        # prefix would be a dead path at install time.
        run: |
          set -euo pipefail
          pkg=$(find output -name '*.conda' | head -1)
          mkdir -p audit && cd audit
          unzip -oq "../$pkg"
          tar --use-compress-program=unzstd -xf pkg-*.tar.zst
          bins=$(find bin libexec -type f -perm -u+x 2>/dev/null || true)
          if [ -z "$bins" ]; then echo "no binaries found to audit" >&2; exit 1; fi
          status=0
          for f in $bins; do
            case "$(uname -s)" in
              Linux) deps=$(readelf -d "$f" 2>/dev/null | awk '/NEEDED/ {print $NF}' | tr -d '[]') ;;
              Darwin) deps=$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}') ;;
            esac
            for d in $deps; do
              case "$d" in
                libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|ld-linux*|/usr/lib/libSystem.B.dylib|/usr/lib/libc++.1.dylib|/usr/lib/libc++abi.dylib|/usr/lib/libresolv*) ;;
                *) echo "UNEXPECTED dependency in $f: $d"; status=1 ;;
              esac
            done
          done
          [ "$status" -eq 0 ] && echo "audit passed: only system libraries referenced"
          exit "$status"
      - name: Post build log as commit comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failure on \`${{ matrix.platform }}\` (run ${GITHUB_RUN_ID}), last part of build.log:"
            echo '```'
            tail -c 60000 build.log
            echo '```'
          } | python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' > comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data-binary @comment.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: output/**/*.conda
          if-no-files-found: error

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to prefix.dev, no API key needed
    steps:
      - uses: actions/download-artifact@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Upload packages to prefix.dev
        run: |
          for pkg in $(find . -name '*.conda'); do
            pixi exec rattler-build upload prefix -c eliacereda "$pkg"
          done
